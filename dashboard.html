const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',pin:'<path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',in:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24">${P[n]}</svg>`;
const $=s=>document.querySelector(s),pg=CONFIG.pages,me=pg[PAGE];
/* theme */
try{const t=localStorage.getItem('facilo-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#trk').innerHTML=ic('moon')+ic('sun')+'<span class="thumb"></span>';
$('#theme').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('facilo-theme',n)}catch(e){}};
/* nav */
$('#navlogo').href=pg.home.file;


$('#nav').innerHTML=Object.entries(pg).map(([k,p])=>`<a href="${p.file}" class="${k===PAGE?'act':''}">${ic(p.icon)}<span>${p.nav}</span></a>`).join('');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)};
const fail=(f,m)=>{const e=f.querySelector('.err');e.textContent=m;e.classList.remove('hide');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')};
const fieldHTML=f=>`<div><label class="l">${f.label}</label><div class="fld">${ic(f.icon)}<input class="inp" name="${f.name}" type="${f.type}" placeholder="${f.placeholder||''}" autocomplete="${f.autocomplete||'off'}"></div></div>`;
const hero=()=>`<div class="lw hero-logo"><span class="logo" role="img" aria-label="Facilo — chercher-la, trouve-la et prendre-le"></span></div>`;
function validate(form,def){
  for(const f of def.fields){const v=form[f.name].value,t=v.trim();
    if(f.required&&!t)return f.error;
    if(f.type==='email'&&!/^\S+@\S+\.\S+$/.test(t))return f.error;
    if(f.minLength&&v.length<f.minLength)return f.error;
    if(f.matches&&v!==form[f.matches].value)return f.error}
  for(const c of def.checks||[])if(c.required&&!form[c.name].checked)return c.error;
  return null}
function authPage(){
  const d=me,isLogin=PAGE==='login',sw=pg[d.switch.to];
  $('#app').innerHTML=`<div class="stage">${hero()}<div class="card">
  <p class="eyebrow" style="margin-bottom:12px"><i></i>${d.eyebrow}</p><h1 style="font-size:2rem">${d.title}</h1><p style="color:var(--sub);font-size:.9rem;margin:8px 0 22px">${d.subtitle}</p>
  <form novalidate>${d.fields.map(fieldHTML).join('')}
  ${isLogin?`<div class="row"><label class="chk" style="align-items:center"><input type="checkbox"> ${d.remember}</label><button type="button" class="lnk" id="forgot">${d.forgot}</button></div>`:''}
  ${(d.checks||[]).map(c=>`<label class="chk"><input type="checkbox" name="${c.name}"> ${c.text}</label>`).join('')}
  <p class="err hide"></p><button class="btn gold w100" type="submit">${d.submit}</button></form>
  ${isLogin?`<div class="or">or</div><div class="two">${d.social.map(s=>`<button class="btn ghost soc" style="border-color:var(--lineg)">${s}</button>`).join('')}</div>`:''}
  <p style="text-align:center;font-size:.9rem;color:var(--sub);margin-top:24px">${d.switch.text} <a class="lnk" href="${sw.file}">${d.switch.label}</a></p></div></div>`;
  const form=$('form');
  form.onsubmit=e=>{e.preventDefault();const m=validate(form,d);if(m)return fail(form,m);
    form.querySelector('.err').classList.add('hide');form.reset();toast(d.successMessage);
    if(d.redirect)setTimeout(()=>location.href=d.redirect,1400)};
  if(isLogin){$('#forgot').onclick=()=>toast(d.forgotMessage);document.querySelectorAll('.soc').forEach(b=>b.onclick=()=>toast(b.textContent+' '+d.socialMessage))}}
function dashPage(){
  const A=CONFIG.admin,D=CONFIG.dashboard;let admin=false;
  const users=D.users.map(u=>({...u})),sec=D.security.map(s=>({...s}));
  $('#app').innerHTML=`<div id="gate" class="stage">${hero()}<div class="card"><div class="icbox" style="margin-bottom:16px">${ic('shield')}</div>
   <p class="eyebrow" style="margin-bottom:12px"><i></i>${me.eyebrow}</p><h1 style="font-size:2rem">${me.title}</h1><p style="color:var(--sub);font-size:.9rem;margin:8px 0 20px">${me.subtitle}</p>
   <form novalidate><div class="fld">${ic('key')}<input class="inp" id="code" autocomplete="off" placeholder="${A.placeholder}" style="letter-spacing:.12em"></div><p class="err hide"></p><button class="btn gold w100" type="submit">${me.submit}</button></form>
   <div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--line)"><p style="font-size:.75rem;color:var(--mut);margin-bottom:8px">${A.examplesLabel}</p><div class="chips" id="codes">${A.codes.map(c=>`<button type="button" class="pill">${c}</button>`).join('')}</div></div></div></div>
   <section id="dash" class="hide"><div class="dh"><div><p class="eyebrow" style="margin-bottom:8px"><i></i>${me.eyebrow}</p><h1 style="font-size:2.4rem">${me.dashTitle}</h1></div><button class="btn ghost" id="out">${ic('out')}${me.logout}</button></div>
   <div class="grid3" id="stats"></div><div class="dg"><div class="card"><h3 style="font-size:1.1rem;margin-bottom:12px">${D.usersTitle}</h3><div class="tw"><table><tbody id="rows"></tbody></table></div></div>
   <div class="card"><h3 style="font-size:1.1rem;margin-bottom:16px">${D.securityTitle}</h3><div id="sec" style="display:grid;gap:16px;font-size:.9rem"></div><button class="btn gold w100" id="lock" style="margin-top:20px">${ic('lock')}${D.lockButton}</button></div></div></section>`;
  const render=()=>{
    $('#gate').classList.toggle('hide',admin);$('#dash').classList.toggle('hide',!admin);if(!admin)return;
    const alerts=users.filter(u=>u.status!=='ok').length;
    $('#stats').innerHTML=D.stats.map(s=>`<div class="card lift stat"><div class="icbox">${ic(s.icon)}</div><div><span style="font-size:.9rem;color:var(--sub)">${s.label}</span><b>${s.value==='auto'?alerts:s.value}</b></div></div>`).join('');
    $('#rows').innerHTML=users.map((u,i)=>`<tr><td><b>${u.name}</b></td><td style="color:var(--sub)">${u.email}</td><td><span class="pill p-${u.status}">${D.statusLabels[u.status]}</span></td><td style="text-align:right"><button class="lnk" data-u="${i}">${u.status==='ban'?'Unblock':u.status==='wait'?'Approve':'Block'}</button></td></tr>`).join('');
    $('#sec').innerHTML=sec.map((s,i)=>`<div class="row"><span>${s.label}</span><span class="tgl ${s.on?'on':''}" data-t="${i}" role="switch" tabindex="0" aria-checked="${s.on}"></span></div>`).join('')};
  const form=$('#gate form');
  form.onsubmit=e=>{e.preventDefault();const c=$('#code').value.trim().toUpperCase();
    if(A.codes.includes(c)){admin=true;$('#code').value='';render();toast(A.granted)}else fail(form,A.wrongCode)};
  $('#codes').onclick=e=>{if(e.target.tagName==='BUTTON'){$('#code').value=e.target.textContent;$('#code').focus()}};
  $('#out').onclick=()=>{admin=false;render();toast(A.closed)};
  $('#rows').onclick=e=>{const i=e.target.dataset.u;if(i==null)return;const u=users[i];u.status=u.status==='ok'?'ban':'ok';render();toast(u.name+' updated.')};
  $('#sec').onclick=e=>{const i=e.target.dataset.t;if(i==null)return;sec[i].on=!sec[i].on;render()};
  $('#sec').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();e.target.click()}};
  $('#lock').onclick=()=>toast(D.lockMessage);
  render()}
